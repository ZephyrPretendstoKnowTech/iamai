# Dependency updates for the one npm project at the repository root, weekly.
#
# Bounded on purpose: this repository has no server, no container and no
# published package, so the only supply chain it has is the build's npm tree.
# A weekly pull request against the root manifest is the whole contract.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One pull request a week for the whole tree: separate ones filled the
    # open-PR limit in October 2026 and updates stopped arriving.
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
