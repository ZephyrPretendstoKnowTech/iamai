# Publishes the site to GitHub Pages from a clean checkout (prompt 35 §1).
#
#   getiamai.com/           the home page (generated, home/)
#   getiamai.com/planner/   the planner (the Vite bundle)
#
# One repository, one workflow, one domain, one source: `main`. scripts/toolPath.ts
# names the folder and is the single constant: vite.config.ts derives its base and
# outDir from it, and scripts/assemble-site.mjs reads the same value when it lays
# out dist/. This workflow sets no folder name of its own — a deployment variable
# that has to be remembered publishes the wrong path when it is forgotten.
# Routing is hash-based and the baseline index fetches by absolute URL, so
# nothing else changes with the path.
#
# There is no preview path and no second branch: the retired night-1 preview
# (/next/) was removed with task 016, so nothing but reviewed `main` can reach
# the live site. Production is gated walk → build → deploy: build needs walk, and
# deploy needs build, so a P0 in the walk stops the publication.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the publication is superseded by a newer push. The walk is this
# repository's authoritative validation of an exact commit, so it never carries a
# cancelling concurrency group: a cancelled walk reads as a red commit that was
# never actually judged, and the overnight runner cannot tell that apart from a
# real P0. The `pages` group therefore sits on the deploy job alone, where
# GitHub requires it and where superseding costs nothing but a stale publish.

jobs:
  # The walk (scripts/walk.mjs) on the pushed commit: every surface of the demo
  # and the mock fixtures in headless Chrome, against the surface contracts and
  # the invariants. It exits 1 on a P0, so a P0 stops the build and the deploy.
  # Sessions never run it; this job is where it runs. The report and the
  # captures are kept as a run artifact for reading a failure.
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The walk names its report by short SHA; this is the same commit in full,
      # so a report filename can be tied to a commit without guessing.
      - name: Commit under test
        run: |
          echo "checked out : $(git rev-parse HEAD)"
          echo "short       : $(git rev-parse --short=7 HEAD)"
          echo "github.sha  : ${{ github.sha }}"
          echo "ref         : ${{ github.ref }}"
          echo "subject     : $(git log -1 --pretty=%s)"
      - run: npm ci
      # ubuntu-latest ships Google Chrome; the script finds it on its own.
      - run: npm run walk
        env:
          CHROME: /usr/bin/google-chrome
      # What failed, in one screen. A walk P0 is a deterministic assertion about a
      # fact on screen, and both a human opening this run and the overnight
      # runner reading the log need to see it without downloading the artifact.
      # Anything that is not a P0 list is a job that fell over before the walk
      # could judge anything, and this says that instead of guessing.
      - name: What failed
        if: failure()
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          findings="walk/$sha/findings.json"
          {
            echo "### deploy-pages — what failed"
            echo ""
            if [ -f "$findings" ]; then
              echo "WALK_RESULT: P0 assertions on $sha"
              echo ""
              echo '```'
              node -e '
                const f = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
                const p0 = (f.findings && f.findings.P0) || []
                console.log(`walk ${f.sha}: ${p0.length} P0, ${((f.findings||{}).P1||[]).length} P1`)
                for (const line of p0) console.log(`P0: ${line}`)
                if (!p0.length) console.log("no P0 recorded; the walk job failed before or after its findings")
              ' "$findings"
              echo '```'
            else
              echo "WALK_RESULT: the walk produced no findings file for $sha"
              echo ""
              echo "The job failed before the walk could judge the surfaces (browser startup, install, or the runner itself)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # This run's report beside its captures (walk/<sha>/); the committed reports stay out.
      - if: always()
        run: cp "docs/reports/walk-$(git rev-parse --short=7 HEAD).md" walk/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-${{ github.sha }}
          path: walk/
          if-no-files-found: ignore
  build:
    needs: walk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # What is actually being published. The artifact is built from `main` and
      # from nothing else, so on a push to main this is the commit the walk just
      # judged; printing it is the difference between "my push deployed" and
      # "my push ran and main deployed".
      - name: Commit being published
        run: |
          {
            echo "publishing main : $(git rev-parse HEAD)  ($(git log -1 --pretty=%s))"
            echo "pushed ref      : ${{ github.ref }}"
            echo "pushed SHA      : ${{ github.sha }}"
          } | tee "$RUNNER_TEMP/published.txt"
          {
            echo "### deploy-pages — what is being published"
            echo '```'
            cat "$RUNNER_TEMP/published.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      # Deterministic only: EXTERNAL_HEALTH is unset, so the Learn-link probe
      # skips itself here. A Microsoft Learn outage used to be able to fail this
      # step and block the deploy of a site that was perfectly good.
      - id: test
        run: npm test
      - id: site
        run: npm run build:site
      # Which deterministic assertion failed, named rather than inferred from the
      # log. A failure with none of these named is the job falling over before it
      # asserted anything, which is a different thing and says so.
      - name: What failed
        if: failure()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          SITE_OUTCOME: ${{ steps.site.outcome }}
        run: |
          named=0
          {
            echo "### deploy-pages — what failed"
            echo ""
            if [ "$TEST_OUTCOME" = "failure" ]; then named=1; echo "BUILD_RESULT: deterministic assertion failed — npm test"; fi
            if [ "$SITE_OUTCOME" = "failure" ]; then named=1; echo "BUILD_RESULT: deterministic assertion failed — npm run build:site"; fi
            if [ "$named" = "0" ]; then echo "BUILD_RESULT: no named assertion failed; the job fell over before it asserted anything"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The one place a newer push may take over: an older publication in flight is
    # cancelled here, after its commit has already been walked and built.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
