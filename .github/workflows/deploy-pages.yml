# Publishes the static bundle to GitHub Pages from a clean checkout (prompt 31 §6).
# The site is served from the custom domain getiamai.com at the root, so the
# build base is "/". public/CNAME keeps the domain across deploys. Vite's base
# and MSAL's redirect URI both derive from VITE_BASE, and routing is hash-based,
# so no rewrite rules are needed.
#
# To publish on the github.io fallback instead, set VITE_BASE to /<repo>/ and
# remove public/CNAME.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
