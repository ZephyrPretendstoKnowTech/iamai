# Full validation runs on pull requests, on every push to main and on demand. A
# push to main is published by deploy-pages.yml and never waits for this
# workflow: it reports green or red beside the deploy, it does not gate it.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Type and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Change scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          range="HEAD^..HEAD"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          node scripts/check-change-scope.mjs --range "$range"
      - name: Tenant data guard
        run: node scripts/tenant-guard.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit.log
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:site
      - name: Smoke
        run: set -o pipefail; npm run smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
        env:
          CHROME: /usr/bin/google-chrome
      - name: Record artifact provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/release-artifact.mjs create "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site-${{ github.sha }}
          overwrite: true
          path: |
            dist/
            release-proof.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore
          retention-days: 7
  ci:
    name: ci
    needs: [checks, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both validation jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$CHECKS" = success && test "$BROWSER" = success
