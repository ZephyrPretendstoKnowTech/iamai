# Full validation (typecheck, the unit suite, the build and browser smoke) runs
# on pull requests and on demand, for major changes only (owner, 2026-09-23). It
# no longer runs on every push to main and no longer gates the deploy:
# deploy-pages.yml publishes main on push. Start it with
# `gh workflow run ci --ref main` when a change is big enough to need it.
# The v1.1 branch is the exception: every push to it runs CI, because v1.1 is
# built there before it reaches main (docs/plans/v1.1/plan.md, P0-2).
name: ci
on:
  push:
    branches: [v1.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Type and unit checks
    runs-on: ubuntu-latest
    # The suite is ~13-15 minutes and was sitting on a 15-minute timeout, so it
    # cancelled itself mid-run and the deploy skipped for a reason that had
    # nothing to do with the code. Headroom, not a target: if this is ever
    # close again the suite has grown enough to be worth splitting.
    # It was: on 2026-10-03 the job ran 24 minutes and one run hit 25 with every
    # test passing. 35 until the suite is split across two jobs.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Change scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          range="HEAD^..HEAD"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          fi
          node scripts/check-change-scope.mjs --range "$range"
      - name: Tenant data guard
        run: node scripts/tenant-guard.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: unit-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit.log
          if-no-files-found: ignore
          retention-days: 7
  browser:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:site
      - name: Smoke
        run: set -o pipefail; npm run smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
        env:
          CHROME: /usr/bin/google-chrome
      - name: Record artifact provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/release-artifact.mjs create "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site-${{ github.sha }}
          overwrite: true
          path: |
            dist/
            release-proof.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore
          retention-days: 7
  ci:
    name: ci
    needs: [checks, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both validation jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$CHECKS" = success && test "$BROWSER" = success
