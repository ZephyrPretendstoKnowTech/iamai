<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The HTML entry is never cached (prompt 40 §25). Its asset filenames carry
      content hashes, so those may be cached forever; this document is the one
      file that must be re-fetched, because it is what names the new hashes.
      GitHub Pages serves it with a 10-minute max-age, so a returning visitor
      could be handed the previous deploy with no way to tell — which is what
      the build stamp in the footer now makes visible.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FBF9F5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%230B5B57'/%3E%3Cpath d='M16 7 A9 9 0 1 1 7 16' fill='none' stroke='%230B5B57' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 2.5 A13.5 13.5 0 0 1 29.5 16' fill='none' stroke='%230B5B57' stroke-width='2.4' stroke-linecap='round' opacity='0.55'/%3E%3C/svg%3E" />
    <!-- Three faces, self-hosted Latin subsets (OFL, public/fonts/OFL.txt); preloaded so the first paint uses them (prompt 47 Part 1). -->
    <link rel="preload" href="/fonts/IBMPlexSerif-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSerif-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Filled from src/copy/product.ts at build (vite.config.ts): the name lives in one place. -->
    <title>__PRODUCT_TITLE__</title>
    <meta name="description" content="IAMAI reads a Microsoft 365 tenant's Conditional Access policies, people and sign-in records, compares them with a proven baseline, and produces a dated rollout plan. Read-only; nothing leaves the browser." />
    <meta property="og:title" content="IAMAI: Microsoft Entra Conditional Access rollout planner" />
    <meta property="og:description" content="A dated Conditional Access rollout plan for Microsoft Entra ID and Microsoft 365, built from your own tenant. Read-only; nothing leaves the browser." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
