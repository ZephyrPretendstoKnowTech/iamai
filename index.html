<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The HTML entry is never cached (prompt 40 §25). Its asset filenames carry
      content hashes, so those may be cached forever; this document is the one
      file that must be re-fetched, because it is what names the new hashes.
      GitHub Pages serves it with a 10-minute max-age, so a returning visitor
      could be handed the previous deploy with no way to tell — which is what
      the build stamp in the footer now makes visible.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!--
      The Threshold app icon (task 029). Both files are derived from the one master,
      src/brand/logo/iamai-threshold-master.svg, by scripts/gen-brand.mjs; the PNG is
      for browsers that will not take an SVG icon. What was here before was a placeholder
      mark drawn inline in this file.
    -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <!-- The faces the first paint sets text in, self-hosted Latin subsets (OFL, public/fonts/OFL.txt): the display
         heading's Serif Bold and the label's Sans SemiBold joined the list when task 030's roles were corrected, so
         nothing on a first paint is drawn as a synthesised fake bold. Serif SemiBold is declared, not preloaded:
         no rule sets it yet. -->
    <link rel="preload" href="/fonts/IBMPlexSerif-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSerif-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSerif-Bold-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-Medium-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexSans-SemiBold-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/IBMPlexMono-Regular-Latin1.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The title is filled from content.json's pages.app.shell.product at build, and the tool folder from
         scripts/toolPath.ts, by the product-title plugin in vite.config.ts: each lives in one place. The
         canonical link is root-relative because src/network.test.ts reads an absolute link href as a request;
         vite-ignore keeps Vite from resolving it as an asset. og:url carries the absolute address. -->
    <title>__PRODUCT_TITLE__</title>
    <meta name="description" content="IAMAI reads a Microsoft Entra tenant with read-only permissions, compares its Conditional Access policies with a reviewed baseline, and writes a dated rollout plan. It runs in your browser, with no IAMAI server." />
    <link rel="canonical" href="/__TOOL_PATH__/" vite-ignore />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__PRODUCT_TITLE__" />
    <meta property="og:description" content="IAMAI reads a Microsoft Entra tenant with read-only permissions, compares its Conditional Access policies with a reviewed baseline, and writes a dated rollout plan. It runs in your browser, with no IAMAI server." />
    <meta property="og:url" content="https://getiamai.com/__TOOL_PATH__/" />
    <meta property="og:image" content="https://getiamai.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
